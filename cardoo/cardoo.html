<!DOCTYPE html>
<html lang="en" data-pal="blue-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardoo — Personal Kanban</title>

  <!--
    Favicon as an inline SVG data URI rather than a separate .ico, so the icon
    cannot get separated from the file if it's copied or moved on its own.
    A filled badge, not an outline, because outlines turn to mush at the 16px
    a bookmarks bar actually renders. Colors are fixed, not theme-driven, so
    the mark stays recognizable in a tab strip regardless of which palette
    the document itself is showing. "#" must be percent-encoded in a data URI.

    Three identical cards, each offset +4x/-4y from the one in front, drawn
    back-to-front. The front card fully covers the lower-left of the one
    behind it, so each card behind only ever shows as an upper-right corner
    and a right edge -- that's geometry, not three separately-drawn slivers.
  -->
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232d2454'/><rect x='15' y='2' width='14' height='18' rx='2.5' fill='%234ecdc4'/><rect x='11' y='6' width='14' height='18' rx='2.5' fill='%23ffd23f' stroke='%232d2454' stroke-width='1'/><rect x='7' y='10' width='14' height='18' rx='2.5' fill='%23ff6b5b' stroke='%232d2454' stroke-width='1'/></svg>">

  <script>
    try {
      var s = localStorage.getItem('cardoo:theme');
      if (s) document.documentElement.setAttribute('data-pal', s);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg-main: #1a1a1a;
      --bg-toolbar: #0d0d0d;
      --bg-lane: #2a2a2a;
      --bg-card: #3a3a3a;
      --fg: #fff;
      --fg-muted: #aaa;
      --fg-faint: #888;
      --border: #333;
      --border-strong: #555;
    }

    :root[data-pal="white-light"] {
      --bg-main: #ffffff;
      --bg-toolbar: #f5f5f5;
      --bg-lane: #eeeeee;
      --bg-card: #ffffff;
      --fg: #1a1a1a;
      --fg-muted: #666;
      --fg-faint: #999;
      --border: #ddd;
      --border-strong: #bbb;
    }

    :root[data-pal="beige-light"] {
      --bg-main: #faf9f5;
      --bg-toolbar: #f0ede6;
      --bg-lane: #e9e5d8;
      --bg-card: #faf9f5;
      --fg: #191917;
      --fg-muted: #6b634e;
      --fg-faint: #8b7f6d;
      --border: #d6cfbb;
      --border-strong: #b3a593;
    }

    :root[data-pal="slate-dark"] {
      --bg-main: #0f1419;
      --bg-toolbar: #0a0d12;
      --bg-lane: #151a23;
      --bg-card: #1a202b;
      --fg: #e0e6ed;
      --fg-muted: #9099a8;
      --fg-faint: #6b7684;
      --border: #2a3548;
      --border-strong: #3d4a61;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-main); color: var(--fg); }
    .toolbar { background: var(--bg-toolbar); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 8px; align-items: center; }
    .toolbar-logo { width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0; margin-right: 4px; }
    .toolbar button { background: var(--bg-card); border: 1px solid var(--border-strong); color: var(--fg); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .toolbar button:hover { background: var(--bg-lane); border-color: var(--fg-muted); }
    .toolbar button:disabled { opacity: 0.35; cursor: default; }
    .toolbar button:disabled:hover { background: var(--bg-card); border-color: var(--border-strong); }
    .container { display: flex; gap: 16px; padding: 20px; max-width: 1400px; margin: 0 auto; overflow-x: auto; min-height: 100vh; }
    .lane { background: var(--bg-lane); border-radius: 8px; padding: 12px; min-width: 300px; flex-shrink: 0; display: flex; flex-direction: column; }
    .lane-title { font-weight: 600; margin-bottom: 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fg-muted); }
    .cards { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card { background: var(--bg-card); padding: 12px; border-radius: 6px; cursor: move; user-select: none; border: 1px solid var(--border);
      transition: all 0.2s; }
    .card:hover { background: var(--bg-lane); border-color: var(--border-strong); }
    .card.dragging { opacity: 0.5; }
    .card.drag-over { background: var(--bg-lane); border-color: var(--border-strong); }
    .card-gap-placeholder { height: 0; flex-shrink: 0; overflow: hidden; border-radius: 6px;
      border: 2px dashed var(--border-strong); background: var(--bg-lane); transition: height 0.35s ease; }
    .card-gap-placeholder.open { height: 52px; }
    .card-text { font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .card-delete { float: right; cursor: pointer; color: var(--fg-faint); font-size: 16px; margin-left: 8px; }
    .card-delete:hover { color: #f00; }
    .add-card { background: var(--bg-lane); border: 1px dashed var(--border-strong); padding: 8px; border-radius: 6px; cursor: pointer;
      text-align: center; font-size: 12px; color: var(--fg-faint); transition: all 0.2s; margin-top: auto; }
    .add-card:hover { background: var(--bg-card); border-color: var(--fg-muted); color: var(--fg-muted); }
    .input-dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-lane);
      border: 1px solid var(--border); border-radius: 8px; padding: 20px; z-index: 1000; min-width: 300px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .input-dialog input { width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px;
      color: var(--fg); font-size: 14px; margin-bottom: 12px; }
    .input-dialog button { width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 4px;
      color: var(--fg); cursor: pointer; font-size: 14px; transition: all 0.2s; margin-bottom: 8px; }
    .input-dialog button:hover { background: var(--bg-lane); }
    .input-dialog button:last-child { background: var(--border-strong); margin-bottom: 0; }
    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 999; }
    .fire-meter { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .fire-bar { width: 120px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
    .fire-fill { height: 100%; background: #0f0; width: 0%; transition: width 0.2s, background-color 0.2s; }
    .fire-label { font-size: 11px; color: #999; min-width: 40px; text-align: right; }
    .autosave-indicator { display: none; align-items: center; gap: 6px; margin-left: auto; }
    .autosave-dot { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; flex-shrink: 0; }
    .autosave-dot.saving { animation: autosave-fade 0.6s ease-in-out; }
    @keyframes autosave-fade { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .autosave-text { font-size: 11px; color: var(--fg-faint); }
    #toast { position: fixed; left: 50%; top: 62px; transform: translate(-50%, -8px); z-index: 100; background: #2a2a2a;
      color: #fff; border: 1px solid #555; border-radius: 6px; padding: 10px 14px; font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s; max-width: 70vw; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.alert { border-color: #f80; color: #ff9944; }
    mark { background: #ffff00; color: #000; padding: 2px 4px; border-radius: 2px; font-weight: normal; }
    .detail-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-lane);
      border: 1px solid var(--border); border-radius: 8px; padding: 20px; z-index: 1000; width: 85vw; height: 80vh;
      max-width: 900px; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .detail-modal h3 { margin-bottom: 12px; font-size: 14px; color: var(--fg-muted); text-transform: uppercase; }
    .detail-content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .detail-text { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 12px; margin-bottom: 12px;
      flex: 1; overflow-y: auto; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
    .detail-edit { width: 100%; flex: 1; min-height: 0; padding: 10px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 4px; color: var(--fg); font-family: monospace; font-size: 13px; display: none; resize: none; margin-bottom: 12px; }
    .detail-buttons { display: flex; gap: 8px; }
    .detail-buttons button { flex: 1; padding: 8px; background: var(--bg-card); border: 1px solid var(--border-strong);
      border-radius: 4px; color: var(--fg); cursor: pointer; font-size: 13px; }
    .detail-buttons button:hover { background: var(--bg-lane); }
    .config-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2a2a2a;
      border: 1px solid #444; border-radius: 8px; padding: 20px; z-index: 1000; min-width: 400px; max-width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .config-modal h3 { margin-bottom: 16px; font-size: 16px; }
    .config-item { margin-bottom: 12px; }
    .config-item label { display: block; font-size: 13px; color: #ccc; margin-bottom: 4px; }
    .config-item input[type="checkbox"] { margin-right: 6px; }
    .config-modal button { width: 100%; padding: 10px; margin-top: 8px; background: #4a4a4a; border: 1px solid #555; border-radius: 4px; color: #fff; cursor: pointer; font-size: 13px; }
    .config-modal button:hover { background: #5a5a5a; }
    .config-modal button.close { background: #666; }
  </style>
</head>
<body>
  <div class="toolbar">
    <svg class="toolbar-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" title="Cardoo — Personal Kanban">
      <rect width="32" height="32" rx="7" fill="#2d2454"/>
      <rect x="15" y="2" width="14" height="18" rx="2.5" fill="#4ecdc4"/>
      <rect x="11" y="6" width="14" height="18" rx="2.5" fill="#ffd23f" stroke="#2d2454" stroke-width="1"/>
      <rect x="7" y="10" width="14" height="18" rx="2.5" fill="#ff6b5b" stroke="#2d2454" stroke-width="1"/>
    </svg>
    <button id="undoBtn" onclick="undoMove()" title="Undo move (Ctrl+Z)" disabled>↶ Undo</button>
    <button id="redoBtn" onclick="redoMove()" title="Redo move (Ctrl+R)" disabled>↷ Redo</button>
    <button onclick="exportState()">📥 Export</button>
    <button onclick="importState()">📤 Import</button>
    <button onclick="cycleTheme()">🎨 Theme</button>
    <button onclick="openConfig()">⚙️ Config</button>
    <button id="resumeAutoSaveBtn" onclick="selectFolder()" style="display: none;"></button>
    <div class="fire-meter" id="fireMeter">
      <span class="fire-label" id="changeCount">0</span>
      <div class="fire-bar">
        <div class="fire-fill" id="fireFill"></div>
      </div>
    </div>
    <div class="autosave-indicator" id="autoSaveIndicator">
      <span class="autosave-dot"></span>
      <span class="autosave-text">Autosaved</span>
    </div>
  </div>
  <div class="container" id="board"></div>
  <div id="overlay" class="overlay" style="display: none;"></div>
  <div id="dialog" class="input-dialog" style="display: none;">
    <input type="text" id="input" placeholder="Enter card text..." />
    <button onclick="saveInput()">Add</button>
    <button onclick="cancelInput()">Cancel</button>
  </div>
  <div id="toast"></div>
  <div id="detailOverlay" class="overlay" style="display: none;"></div>
  <div id="detailModal" class="detail-modal" style="display: none;">
    <h3 id="detailTitle">Card Details</h3>
    <div class="detail-content">
      <div id="detailText" class="detail-text"></div>
      <textarea id="detailEdit" class="detail-edit"></textarea>
    </div>
    <div class="detail-buttons">
      <button onclick="toggleDetailEdit()">✏️ Edit</button>
      <button onclick="saveDetailEdit()">💾 Save</button>
      <button onclick="closeDetail()">Close</button>
    </div>
  </div>
  <div id="configOverlay" class="overlay" style="display: none;"></div>
  <div id="configModal" class="config-modal" style="display: none;">
    <h3>Backup Config</h3>
    <div class="config-item">
      <label>
        <input type="checkbox" id="autoExportToggle" onchange="toggleAutoExport()" disabled />
        Auto-export to local folder (Chrome/Edge only)
      </label>
      <small style="color: #888; display: block; margin-top: 4px;">
        Choose a folder below to arm it -- the browser can't remember folder
        access across a refresh, so this re-enables each session
      </small>
    </div>
    <div class="config-item" id="folderStatus" style="font-size: 12px; color: #888;">
      No folder selected
    </div>
    <button onclick="selectFolder()">Choose Folder</button>
    <button class="close" onclick="closeConfig()">Done</button>
  </div>

  <script>
    const LANES = ['Pondering', 'To Do', 'In Progress', 'Done'];
    const THEMES = ['blue-dark', 'slate-dark', 'white-light', 'beige-light'];
    let data = { cards: {}, laneOrder: {} };
    let currentLaneForInput = null;
    let changeCount = 0;
    let folderHandle = null;
    let autoExportEnabled = false;
    let wasRed = false;
    let toastTimer = null;
    let currentTheme = 'blue-dark';
    let moveUndoStack = [];
    let moveRedoStack = [];
    const MAX_MOVE_HISTORY = 50;

    // Hold-to-reorder: hovering between two cards for GAP_HOLD_MS opens a
    // placeholder gap at that exact position. holdLane/holdIndex track what's
    // currently being timed; gapLane/gapIndex/gapPlaceholder track a gap that
    // has actually opened (hold completed) and is live for the next drop.
    const GAP_HOLD_MS = 1500;
    let holdTimer = null;
    let holdLane = null;
    let holdIndex = null;
    let gapLane = null;
    let gapIndex = null;
    let gapPlaceholder = null;

    function initData() {
      const stored = localStorage.getItem('cardoo');
      if (stored) {
        data = JSON.parse(stored);
      } else {
        LANES.forEach(lane => {
          data.cards[lane] = [];
          data.laneOrder[lane] = [];
        });
        saveData();
      }
      changeCount = localStorage.getItem('cardoo:changes') ? parseInt(localStorage.getItem('cardoo:changes')) : 0;

      // folderHandle can never survive a refresh -- file:// pages can't persist
      // that permission grant -- so auto-export always starts OFF regardless of
      // what was saved last session. Trusting the saved flag here is exactly
      // what let the toggle show "on" while silently writing nothing.
      autoExportEnabled = false;
      const savedFolderName = localStorage.getItem('cardoo:folderName');
      if (savedFolderName && localStorage.getItem('cardoo:autoExport') === 'true') {
        document.getElementById('folderStatus').textContent =
          'Auto-export was on for "' + savedFolderName + '" — choose it again to resume';
        // Surface this in the toolbar too, not just buried in Config -- the
        // picker itself remembers the folder (see the `id` on
        // showDirectoryPicker below), so this is genuinely one click, not a
        // folder hunt.
        const resumeBtn = document.getElementById('resumeAutoSaveBtn');
        resumeBtn.textContent = '▶ Resume Autosave';
        resumeBtn.title = 'Resume auto-export to "' + savedFolderName + '"';
        resumeBtn.style.display = 'inline-block';
      }
      document.getElementById('autoExportToggle').checked = false;
      document.getElementById('autoExportToggle').disabled = true;

      currentTheme = localStorage.getItem('cardoo:theme') || 'blue-dark';
      document.documentElement.setAttribute('data-pal', currentTheme);
      updateFireMeter();
      updateFireMeterVisibility();
    }

    function cycleTheme() {
      const idx = THEMES.indexOf(currentTheme);
      currentTheme = THEMES[(idx + 1) % THEMES.length];
      document.documentElement.setAttribute('data-pal', currentTheme);
      localStorage.setItem('cardoo:theme', currentTheme);
      const names = { 'blue-dark': 'Blue Dark', 'slate-dark': 'Slate Dark', 'white-light': 'White Light', 'beige-light': 'Beige Light' };
      toast('Theme: ' + names[currentTheme]);
    }

    function saveData() {
      localStorage.setItem('cardoo', JSON.stringify(data));
    }

    function updateChangeCount() {
      changeCount++;
      localStorage.setItem('cardoo:changes', changeCount);
      updateFireMeter();
      if (autoExportEnabled && folderHandle) {
        autoExportToFolder();
      }
    }

    function updateFireMeter() {
      const meter = Math.min(changeCount / 21, 1);
      const fill = document.getElementById('fireFill');
      const label = document.getElementById('changeCount');
      const isRed = changeCount >= 21;

      label.textContent = isRed ? '🔥' : changeCount;
      fill.style.width = (meter * 100) + '%';

      if (changeCount < 11) {
        fill.style.backgroundColor = '#0f0';
      } else if (changeCount < 21) {
        fill.style.backgroundColor = '#ff0';
      } else {
        fill.style.backgroundColor = '#f00';
      }

      if (isRed && !wasRed) {
        toast('Time to export your work! 🔥');
        wasRed = true;
      } else if (!isRed) {
        wasRed = false;
      }
    }

    // The meter exists to nudge a human into backing up manually. Once
    // autosave is actually armed and writing on its own, that nudge has
    // nothing left to do -- showing it anyway is just noise.
    function updateFireMeterVisibility() {
      const armed = autoExportEnabled && folderHandle;
      document.getElementById('fireMeter').style.display = armed ? 'none' : 'flex';
      document.getElementById('autoSaveIndicator').style.display = armed ? 'flex' : 'none';
    }

    // Cues an actual write completing, in real time, without a toast on
    // every change. Re-adding the same class name doesn't retrigger a CSS
    // animation on its own, so drop it and force a reflow first -- otherwise
    // two autosaves close together only fade once.
    function flashAutoSaveDot() {
      const dot = document.querySelector('#autoSaveIndicator .autosave-dot');
      if (!dot) return;
      dot.classList.remove('saving');
      void dot.offsetWidth;
      dot.classList.add('saving');
    }

    function toast(msg, isAlert) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.toggle('alert', !!isAlert);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), isAlert ? 9600 : 4800);
    }

    // Index the dragged card would land at among a lane's OTHER cards, based
    // on comparing pointer Y against each card's vertical midpoint. Excludes
    // .dragging so the result is already relative to the post-removal array
    // -- the same index works whether this is a same-lane reorder or a
    // cross-lane move, with no off-by-one adjustment needed either way.
    function getCardInsertIndex(cardsDiv, y) {
      const cards = Array.from(cardsDiv.querySelectorAll('.card:not(.dragging)'));
      for (let i = 0; i < cards.length; i++) {
        const rect = cards[i].getBoundingClientRect();
        if (y < rect.top + rect.height / 2) return i;
      }
      return cards.length;
    }

    function clearGapHold() {
      clearTimeout(holdTimer);
      holdTimer = null;
      holdLane = null;
      holdIndex = null;
      if (gapPlaceholder) gapPlaceholder.remove();
      gapPlaceholder = null;
      gapLane = null;
      gapIndex = null;
    }

    function openGap(lane, cardsDiv, index) {
      const cards = Array.from(cardsDiv.querySelectorAll('.card:not(.dragging)'));
      const placeholder = document.createElement('div');
      placeholder.className = 'card-gap-placeholder';
      cardsDiv.insertBefore(placeholder, cards[index] || cardsDiv.querySelector('.add-card'));
      void placeholder.offsetHeight; // force reflow so the height transition actually animates
      placeholder.classList.add('open');
      gapLane = lane;
      gapIndex = index;
      gapPlaceholder = placeholder;
    }

    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      LANES.forEach(lane => {
        const laneDiv = document.createElement('div');
        laneDiv.className = 'lane';

        const title = document.createElement('div');
        title.className = 'lane-title';
        title.textContent = lane;
        laneDiv.appendChild(title);

        const cardsDiv = document.createElement('div');
        cardsDiv.className = 'cards';
        cardsDiv.dataset.lane = lane;
        cardsDiv.ondragover = (e) => {
          e.preventDefault();
          const index = getCardInsertIndex(cardsDiv, e.clientY);
          const cardCount = cardsDiv.querySelectorAll('.card:not(.dragging)').length;
          const isBetweenCards = index > 0 && index < cardCount;

          if (holdLane === lane && holdIndex === index) return; // already timing this exact gap

          clearGapHold();
          if (isBetweenCards) {
            holdLane = lane;
            holdIndex = index;
            holdTimer = setTimeout(() => openGap(lane, cardsDiv, index), GAP_HOLD_MS);
          }
        };
        cardsDiv.ondrop = (e) => handleDrop(e, lane);
        cardsDiv.ondragleave = (e) => {
          e.currentTarget.classList.remove('drag-over');
          // dragleave also fires when moving between child elements -- only
          // treat it as actually leaving the lane, not just crossing a card.
          if (!cardsDiv.contains(e.relatedTarget)) clearGapHold();
        };

        const cardOrder = data.laneOrder[lane] || [];
        cardOrder.forEach(cardId => {
          const cardData = data.cards[lane]?.find(c => c.id === cardId);
          const cardText = cardData?.text;
          if (cardText) {
            const card = document.createElement('div');
            card.className = 'card';
            card.draggable = true;
            card.dataset.id = cardId;
            card.dataset.lane = lane;
            card.ondragstart = (e) => {
              e.dataTransfer.effectAllowed = 'move';
              e.currentTarget.classList.add('dragging');
            };
            card.ondragend = (e) => {
              e.currentTarget.classList.remove('dragging');
              clearGapHold(); // covers a drag abandoned without a drop
            };

            const text = document.createElement('span');
            text.className = 'card-text';
            const firstLine = cardText.split('\n')[0];
            text.textContent = firstLine;

            const del = document.createElement('span');
            del.className = 'card-delete';
            del.textContent = '×';
            del.onclick = (e) => { e.stopPropagation(); deleteCard(lane, cardId); };

            card.appendChild(del);
            card.appendChild(text);
            card.onclick = () => showDetail(lane, cardId, cardText);
            cardsDiv.appendChild(card);
          }
        });

        const addBtn = document.createElement('div');
        addBtn.className = 'add-card';
        addBtn.textContent = '+ Add card';
        addBtn.onclick = () => openInput(lane);
        cardsDiv.appendChild(addBtn);

        laneDiv.appendChild(cardsDiv);
        board.appendChild(laneDiv);
      });
    }

    function handleDrop(e, toLane) {
      e.preventDefault();
      const card = document.querySelector('.card.dragging');
      if (!card) { clearGapHold(); return; }

      const cardId = card.dataset.id;
      const fromLane = card.dataset.lane;
      const fromIndex = (data.laneOrder[fromLane] || []).indexOf(cardId);
      if (fromIndex === -1) { clearGapHold(); return; }

      // A gap held open in THIS lane wins; otherwise keep the original
      // default of appending to the bottom, unchanged from before this
      // feature existed.
      const usingGap = gapLane === toLane && gapIndex !== null;
      const toIndex = usingGap ? gapIndex : (data.laneOrder[toLane] || []).length;

      pushMoveHistory({ cardId, fromLane, fromIndex, toLane, toIndex });
      moveCard(cardId, fromLane, toLane, toIndex);

      saveData();
      updateChangeCount();
      clearGapHold();
      render();
      e.currentTarget.classList.remove('drag-over');
    }

    // Moves are recorded as { cardId, fromLane, fromIndex, toLane, toIndex }
    // rather than full-board snapshots, so undo/redo only ever touches the
    // one card that moved -- an add or delete elsewhere in between doesn't
    // get silently reverted. toIndex is always relative to the lane's state
    // with the card already removed (see getCardInsertIndex), so splice
    // works directly with no off-by-one adjustment for the same-lane case.
    function moveCard(cardId, fromLane, toLane, toIndex) {
      const fromIndex = (data.laneOrder[fromLane] || []).indexOf(cardId);
      if (fromIndex === -1) return null;
      const cardData = data.cards[fromLane][fromIndex];

      data.cards[fromLane].splice(fromIndex, 1);
      data.laneOrder[fromLane].splice(fromIndex, 1);

      if (!data.cards[toLane]) data.cards[toLane] = [];
      if (!data.laneOrder[toLane]) data.laneOrder[toLane] = [];
      // Clamp rather than trust the caller's index -- if cards were added or
      // removed in toLane since toIndex was computed (e.g. an old undo
      // entry), splice would otherwise insert at a stale position instead of
      // degrading safely to the nearest valid one.
      const insertAt = Math.min(toIndex ?? data.laneOrder[toLane].length, data.laneOrder[toLane].length);
      data.cards[toLane].splice(insertAt, 0, cardData);
      data.laneOrder[toLane].splice(insertAt, 0, cardId);

      return fromIndex;
    }

    function pushMoveHistory(move) {
      moveUndoStack.push(move);
      if (moveUndoStack.length > MAX_MOVE_HISTORY) moveUndoStack.shift();
      moveRedoStack = [];
      updateMoveButtons();
    }

    function undoMove() {
      const move = moveUndoStack.pop();
      if (!move) return;
      if (moveCard(move.cardId, move.toLane, move.fromLane, move.fromIndex) !== null) {
        moveRedoStack.push(move);
        saveData();
        updateChangeCount();
        render();
        toast('↶ Undo move');
      }
      updateMoveButtons();
    }

    function redoMove() {
      const move = moveRedoStack.pop();
      if (!move) return;
      if (moveCard(move.cardId, move.fromLane, move.toLane, move.toIndex) !== null) {
        moveUndoStack.push(move);
        saveData();
        updateChangeCount();
        render();
        toast('↷ Redo move');
      }
      updateMoveButtons();
    }

    function updateMoveButtons() {
      document.getElementById('undoBtn').disabled = moveUndoStack.length === 0;
      document.getElementById('redoBtn').disabled = moveRedoStack.length === 0;
    }

    // Browsers deliberately never let a page block navigation outright, so
    // this can't prevent a refresh -- only make an accidental one (a
    // muscle-memory F5) trigger the browser's own "leave site?" confirmation
    // first, since that's the one way autosave silently disarms itself.
    // The wording is entirely browser-controlled; setting returnValue is
    // what triggers the native prompt at all, in every engine that supports it.
    window.addEventListener('beforeunload', (e) => {
      if (autoExportEnabled && folderHandle) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    document.addEventListener('keydown', (e) => {
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      const inField = tag === 'INPUT' || tag === 'TEXTAREA';

      if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') {
        if (inField) return; // let the browser's native undo handle text editing
        e.preventDefault();
        undoMove();
      }
      if (e.ctrlKey && e.key.toLowerCase() === 'r') {
        e.preventDefault(); // always override the browser's page-reload binding
        redoMove();
      }
    });

    function openInput(lane) {
      currentLaneForInput = lane;
      document.getElementById('overlay').style.display = 'block';
      document.getElementById('dialog').style.display = 'block';
      document.getElementById('input').value = '';
      document.getElementById('input').focus();
    }

    function saveInput() {
      const text = document.getElementById('input').value.trim();
      if (!text || !currentLaneForInput) return;

      const cardId = Date.now().toString();
      if (!data.cards[currentLaneForInput]) data.cards[currentLaneForInput] = [];
      if (!data.laneOrder[currentLaneForInput]) data.laneOrder[currentLaneForInput] = [];

      data.cards[currentLaneForInput].push({ id: cardId, text });
      data.laneOrder[currentLaneForInput].push(cardId);

      saveData();
      updateChangeCount();
      cancelInput();
      render();
    }

    function cancelInput() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('dialog').style.display = 'none';
      currentLaneForInput = null;
    }

    function deleteCard(lane, cardId) {
      data.cards[lane] = data.cards[lane].filter(c => c.id !== cardId);
      data.laneOrder[lane] = data.laneOrder[lane].filter(id => id !== cardId);
      saveData();
      updateChangeCount();
      render();
    }

    function exportState() {
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const filename = 'cardoo-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      changeCount = 0;
      localStorage.setItem('cardoo:changes', '0');
      updateFireMeter();
    }

    async function autoExportToFolder() {
      if (!folderHandle) return;
      try {
        const filename = 'cardoo-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        const fileHandle = await folderHandle.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
        // Only reset on a confirmed write -- a failed autosave must leave the
        // meter exactly where it was, or a silent write error would tell the
        // user their work is backed up when it isn't. No success toast: the
        // green dot in the toolbar already says this continuously, and a
        // toast on every single change would just be noise on top of it.
        changeCount = 0;
        localStorage.setItem('cardoo:changes', '0');
        updateFireMeter();
        flashAutoSaveDot();
      } catch (err) {
        console.warn('Auto-export failed:', err);
        // This IS worth a toast -- the meter is hidden while armed, so a
        // failed write has no other visible signal without this.
        toast('⚠ Autosave failed -- your changes are not backed up', true);
      }
    }

    function importState() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const imported = JSON.parse(evt.target.result);
            if (imported.cards && imported.laneOrder) {
              data = imported;
              saveData();
              render();
              alert('✓ Cards restored from backup');
            } else {
              alert('✗ Invalid backup file format');
            }
          } catch (err) {
            alert('✗ Could not read file: ' + err.message);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function openConfig() {
      document.getElementById('configOverlay').style.display = 'block';
      document.getElementById('configModal').style.display = 'block';
    }

    function closeConfig() {
      document.getElementById('configOverlay').style.display = 'none';
      document.getElementById('configModal').style.display = 'none';
    }

    function toggleAutoExport() {
      const checked = document.getElementById('autoExportToggle').checked;
      if (checked && !folderHandle) {
        // Shouldn't be reachable -- the box stays disabled until a folder
        // exists -- but guard anyway rather than trust the checkbox alone.
        document.getElementById('autoExportToggle').checked = false;
        toast('Choose a folder first');
        return;
      }
      autoExportEnabled = checked;
      localStorage.setItem('cardoo:autoExport', autoExportEnabled);
      updateFireMeterVisibility();
    }

    async function selectFolder() {
      try {
        // A refresh always drops the actual permission grant -- file:// pages
        // can't use IndexedDB, the only API that can store a directory handle
        // across a session -- so re-arming can't be automatic. The `id` here
        // is the next best thing: Chromium remembers the last folder used for
        // it, so the dialog reopens already pointed at the right place
        // instead of defaulting back to Downloads every time.
        folderHandle = await window.showDirectoryPicker({ id: 'cardoo-autosave-folder' });
        const name = folderHandle.name || 'Selected folder';
        document.getElementById('folderStatus').textContent = '✓ Folder: ' + name;
        localStorage.setItem('cardoo:folderName', name);

        // Picking a folder is the one action that arms auto-export -- not a
        // second, independently-settable checkbox -- so the two can't drift
        // out of sync the way "enabled but no handle" did before this fix.
        const toggle = document.getElementById('autoExportToggle');
        toggle.disabled = false;
        toggle.checked = true;
        autoExportEnabled = true;
        localStorage.setItem('cardoo:autoExport', 'true');
        document.getElementById('resumeAutoSaveBtn').style.display = 'none';
        updateFireMeterVisibility();
        toast('Auto-export armed for "' + name + '"');
      } catch (err) {
        if (err.name !== 'AbortError') {
          alert('Could not select folder: ' + err.message);
        }
      }
    }

    document.getElementById('input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') saveInput();
      if (e.key === 'Escape') cancelInput();
    });

    document.getElementById('overlay').addEventListener('click', cancelInput);
    document.getElementById('configOverlay').addEventListener('click', closeConfig);

    let detailLane = null;
    let detailCardId = null;

    function showDetail(lane, cardId, cardText) {
      detailLane = lane;
      detailCardId = cardId;
      const detailText = document.getElementById('detailText');
      detailText.innerHTML = '';

      const parts = cardText.split(/<<(.*?)>>/);
      for (let i = 0; i < parts.length; i++) {
        const text = parts[i];
        const lines = text.split('\n');

        for (let j = 0; j < lines.length; j++) {
          if (i % 2 === 0) {
            const span = document.createElement('span');
            span.textContent = lines[j];
            detailText.appendChild(span);
          } else {
            const mark = document.createElement('mark');
            mark.textContent = lines[j];
            detailText.appendChild(mark);
          }

          if (j < lines.length - 1) {
            detailText.appendChild(document.createElement('br'));
          }
        }
      }

      document.getElementById('detailEdit').value = cardText;
      document.getElementById('detailEdit').style.display = 'none';
      // Must be reset: toggleDetailEdit() hides this to show the editor, and a
      // stale display:none here is what made saved highlights look invisible.
      detailText.style.display = 'block';
      document.getElementById('detailOverlay').style.display = 'block';
      // "flex", not "block" -- an inline display beats the stylesheet, and the
      // modal's layout depends on it staying a column flex container.
      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeDetail() {
      document.getElementById('detailOverlay').style.display = 'none';
      document.getElementById('detailModal').style.display = 'none';
      detailLane = null;
      detailCardId = null;
    }

    function toggleDetailEdit() {
      const editArea = document.getElementById('detailEdit');
      const detailText = document.getElementById('detailText');
      const isHidden = editArea.style.display === 'none' || !editArea.style.display;
      if (isHidden) {
        editArea.style.display = 'block';
        detailText.style.display = 'none';
        editArea.focus();
      } else {
        editArea.style.display = 'none';
        detailText.style.display = 'block';
      }
    }

    function saveDetailEdit() {
      const newText = document.getElementById('detailEdit').value.trim();
      if (!newText || !detailLane || !detailCardId) return;
      const card = data.cards[detailLane].find(c => c.id === detailCardId);
      if (card) {
        card.text = newText;
        saveData();
        updateChangeCount();
        render();
        showDetail(detailLane, detailCardId, newText);
        toast('✓ Card saved');
      }
    }

    document.getElementById('detailOverlay').addEventListener('click', closeDetail);

    initData();
    render();
  </script>
</body>
</html>
